# Task 4 from-scratch DPO on HH-RLHF (guide values from manual §10.3–10.4).
# Policy and reference both start from the SFT best checkpoint. The policy trains on
# cuda:0 (fp32 weights, fp16 autocast + GradScaler); the frozen reference runs on cuda:1.
run_name: dpo_hh
sft_checkpoint: outputs/sft/checkpoints/best
train_file: data/processed/hh/train.jsonl
val_file: data/processed/hh/val.jsonl
output_dir: outputs/dpo_hh

beta: 0.1
max_length: 512
max_prompt_length: 256
per_device_train_batch_size: 1      # pairs per micro-batch
per_device_eval_batch_size: 2
effective_batch_size: 32
gradient_accumulation_steps: null   # null = derive from effective_batch_size (32)

optimizer: adamw
learning_rate: 1.0e-6
lr_scheduler: constant               # fixed learning rate, no decay
warmup_ratio: 0.0
weight_decay: 0.0
max_grad_norm: 1.0
num_epochs: 1
max_steps: null

fp16: true
reference_dtype: fp32               # fp32 so policy and reference are bit-identical at step 0
gradient_checkpointing: false

logging_steps: 5
eval_steps: 50
eval_at_start: true
seed: 42

train_limit: null
val_limit: null
